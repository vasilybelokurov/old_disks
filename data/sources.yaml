# Single source of truth for external inputs. Large files live in ~/data/old_disks.
lvdb:
  what: Local Volume Database (Pace 2024), galaxy parameters (centre, R_half [arcmin], ellipticity, PA, distance [kpc], v_sys, sigma_v)
  release: v1.1.2 (GitHub release 2026-11-04)
  url: https://github.com/apace7/local_volume_database/releases/download/v1.1.2/comb_all.csv
  path: ~/data/old_disks/lvdb/comb_all.csv
  rows: 1733
  sha256: 6a9e03ba53f08f1cf1c07ca21004286a71a7b8c4edcec108a11ec484d1141ffb
  paper: Pace 2025, OJAp 8, 142, https://ui.adsabs.harvard.edu/abs/2025OJAp....8E.142P
lvdb_pm:
  url: https://github.com/apace7/local_volume_database/releases/download/v1.1.2/pm_overview.csv
  path: ~/data/old_disks/lvdb/pm_overview.csv
  rows: 791
  sha256: e39ec1aa4243a9d6cd9e2f3f535a24c0867d926358d6857189f88138ac653dfd
survey_members:
  what: all stars within 3 R_half of 60 LG dwarfs in APOGEE DR17, SDSS-V DR20 BOSS (BOSSNet), DESI DR1 (RVS pipeline); flag `candidate`
  origin: WSDB tables apogee_dr17.allstar, sdss5_dr20.astraallstarbossnet_boss, desi_dr1.stellar_rvs
  fetch: scripts/build_survey_census.py
  path: ~/data/old_disks/survey_members.parquet
  sha256: 9cd043553de6a91ad397ee48edd59f2e2518002488bba4f56538a2e495be1d80
vizier:
  what: 26 published per-star catalogues (list in scripts/fetch_vizier.py); per-table rows, columns and sha256 in data/vizier_manifest.csv
  server: vizier.cfa.harvard.edu (CDS Strasbourg unreachable on 2026-11-06; re-verify checksums against CDS later)
  fetch: scripts/fetch_vizier.py
  path: ~/data/old_disks/vizier/
  missing_on_mirror: J/ApJ/750/33 (Leaman+2012 WLM), J/ApJ/903/10 (Belland+2020 NGC 6822), J/A+A/689/A88 (Taibi+2024 IC 1613),
    J/MNRAS/457/1299 (Kordopatis+2016 Carina), J/A+A/672/A131 (Alarcon Jara+2023 Leo I), J/ApJ/681/L13 (Battaglia+2008 Scl),
    J/ApJ/839/20 (Caldwell+2017 Cra II), J/ApJ/758/124 (Ho+2012 And II)
archives:
  what: science frames, programmes and hours of ESO (raw + phase3) and Keck/DEIMOS spectroscopy within min(3 R_half, 2 deg)
  services: https://archive.eso.org/tap_obs (dbo.raw, ivoa.ObsCore); https://koa.ipac.caltech.edu/TAP (koa_deimos)
  fetch: scripts/build_archive_census.py
  path: data/archive_census.csv
inventory:
  what: per-galaxy counts of members with v and [Fe/H] (published catalogues harmonised by src/olddisks/catalogues.py + WSDB surveys)
  build: scripts/build_inventory.py
  path: data/inventory.csv; per-star ~/data/old_disks/inventory_stars.parquet
